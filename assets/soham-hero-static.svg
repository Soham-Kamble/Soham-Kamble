    <rect width="880" height="372" fill="url(#sk-hero-static-halo)"/>
    <rect width="880" height="372" fill="url(#sk-hero-static-grid)" mask="url(#sk-hero-static-mask)"/>
    <g transform="translate(721 181)" fill="none" stroke="#C77B9B">
