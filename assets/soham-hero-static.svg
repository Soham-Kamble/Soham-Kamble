<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-labelledby="sk-hero-static-title sk-hero-static-desc">
  <title id="sk-hero-static-title">Soham Kamble</title>
  <desc id="sk-hero-static-desc">Backend Developer, Python Developer, Django Developer, Aspiring AI Engineer</desc>
  <defs>
    <linearGradient id="sk-hero-static-base" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10070C"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <radialGradient id="sk-hero-static-halo" cx="78%" cy="43%" r="62%">
      <stop stop-color="#701A3D" stop-opacity=".78"/>
      <stop offset=".56" stop-color="#451126" stop-opacity=".48"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sk-hero-static-fade">
      <stop offset=".26" stop-color="black"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="sk-hero-static-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="372">
      <rect width="880" height="372" fill="url(#sk-hero-static-fade)"/>
