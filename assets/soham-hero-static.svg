      <circle r="53" opacity=".24"/>
      <path d="M-132 0H132M0-132V132" opacity=".22"/>
      <ellipse rx="137" ry="41" transform="rotate(-34)" opacity=".47"/>
      <path d="M0-85a85 85 0 1 1 0 170a85 85 0 1 1 0-170" pathLength="100" stroke="#E5B5C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="13 87" stroke-dashoffset="-8">
