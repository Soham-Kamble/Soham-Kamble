<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Soham Kamble — Software Engineer</title>
<desc id="desc">Python Developer, Django Developer and Backend Developer. Building robust backend systems with Python and Django, and exploring AI engineering. Professional charcoal banner with warm neutral typography and a developer workspace illustration.</desc>
